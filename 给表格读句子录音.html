<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Speech Data Collection System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="stimuli.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; max-width: 850px; margin: 40px auto; background: #f0f2f5; color: #333; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .display-card { background: #fafbfc; border: 2px solid #eef2f7; padding: 50px; margin: 25px 0; border-radius: 15px; min-height: 200px; display: flex; flex-direction: column; justify-content: center; }
        #stimuliText { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; line-height: 1.6; color: #111; }
        #translationText { color: #888; font-style: italic; font-size: 1.2rem; border-top: 1px solid #eee; padding-top: 20px; }
        
        button { padding: 18px 40px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.2s; }
        #recBtn { background: #ea4335; color: white; margin-right: 20px; min-width: 220px; }
        #recBtn.active { background: #c5221f; animation: breathe 1.5s infinite; }
        button:disabled { background: #cbd5e0 !important; color: #7f8c8d !important; cursor: not-allowed; border: 1px solid #bdc3c7; }
        #nextBtn { background: #1a73e8; color: white; }
        
        input[type="text"] { width: 100%; padding: 15px; margin-top: 10px; border: 2px solid #eef2f7; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #666; }
        #hintMsg { color: #ea4335; font-size: 0.85em; margin-top: 15px; display: none; font-weight: bold; }
        
        @keyframes breathe { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div id="setupArea">
        <h1 style="color: #1a73e8;">Speech Data Collection</h1>
        <div style="background: #e8f0fe; padding: 30px; border-radius: 15px; border: 2px dashed #1a73e8; text-align: left;">
            <label><b>Speaker ID / 被试编号:</b></label>
            <input type="text" id="speakerID" placeholder="e.g., Subject_01">
            <p id="dataCheck" style="margin-top:15px; font-weight:bold;"></p>
            <button id="startBtn" style="width:100%; background:#1a73e8; color:white; margin-top:10px;">Start Session</button>
        </div>
    </div>

    <div id="experimentArea" style="display:none;">
        <div class="progress-info">
            <span>Speaker: <b id="nameLabel"></b></span>
            <span>Progress: <b id="progressText"></b></span>
        </div>
        <div class="display-card">
            <div id="stimuliText"></div>
            <div id="translationText"></div>
        </div>
        <div>
            <button id="recBtn">Start Recording</button>
            <button id="nextBtn" disabled>Save & Next</button>
        </div>
        <p id="hintMsg">⚠ Please click "Save & Next" to continue.</p>
    </div>
</div>

<script>
    const ONEDRIVE_LINK = "https://uwprod-my.sharepoint.com/:f:/g/personal/zhang3435_wisc_edu/IgDg3753pVOyRpn8p17GGUYFAQ59CzAJRTGFzUMoIKz4_c0";
    let currentIndex = 0, audioContext, processor, audioData = [], results = [];
    const sampleRate = 16000;

    const recBtn = document.getElementById('recBtn');
    const nextBtn = document.getElementById('nextBtn');
    const hintMsg = document.getElementById('hintMsg');

    // 格式化日期 YYYY-MM-DD
    function getFormattedDate() {
        const d = new Date();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const year = d.getFullYear();
        return `${year}-${month}-${day}`;
    }

    window.onload = () => {
        const check = document.getElementById('dataCheck');
        if (typeof stimuliData !== 'undefined' && stimuliData.length > 0) {
            check.innerText = `✅ Stimuli Loaded: ${stimuliData.length} items.`;
            check.style.color = "#34a853";
        } else {
            check.innerText = "❌ Error: stimuli.js not found.";
            check.style.color = "#ea4335";
            document.getElementById('startBtn').disabled = true;
        }
    };

    document.getElementById('startBtn').onclick = () => {
        const id = document.getElementById('speakerID').value.trim();
        if(!id) return alert("Enter Speaker ID");
        document.getElementById('setupArea').style.display = "none";
        document.getElementById('experimentArea').style.display = "block";
        document.getElementById('nameLabel').innerText = id;
        showTrial();
    };

    function showTrial() {
        const item = stimuliData[currentIndex];
        document.getElementById('stimuliText').innerText = item.s;
        document.getElementById('translationText').innerText = item.en || item.t;
        document.getElementById('progressText').innerText = `${currentIndex + 1} / ${stimuliData.length}`;
    }

    recBtn.onclick = async () => {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const source = audioContext.createMediaStreamSource(stream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = e => audioData.push(new Float32Array(e.inputBuffer.getChannelData(0)));
            source.connect(processor);
        }

        if (recBtn.innerText === "Start Recording") {
            audioData = [];
            processor.connect(audioContext.destination);
            recBtn.innerText = "Stop Recording";
            recBtn.classList.add('active');
            nextBtn.disabled = true;
            hintMsg.style.display = "none";
        } else {
            processor.disconnect();
            recBtn.innerText = "Recording Done";
            recBtn.classList.remove('active');
            recBtn.disabled = true; 
            nextBtn.disabled = false;
            hintMsg.style.display = "block"; 
        }
    };

    nextBtn.onclick = () => {
        results.push({ s: stimuliData[currentIndex].s, t: stimuliData[currentIndex].t, wav: exportWAV(audioData) });
        currentIndex++;
        
        if (currentIndex < stimuliData.length) {
            showTrial();
            recBtn.disabled = false;
            recBtn.innerText = "Start Recording";
            nextBtn.disabled = true;
            hintMsg.style.display = "none";
        } else {
            finalize();
        }
    };

    async function finalize() {
        document.getElementById('experimentArea').innerHTML = "<h2>Processing Data...</h2>";
        const zip = new JSZip();
        const id = document.getElementById('speakerID').value.replace(/\s+/g,'_');
        const dateStr = getFormattedDate(); 
        
        let tsv = "Speaker\tDate\tFile\tStimuli\tTranslation\n";
        
        results.forEach((r, i) => {
            const indexStr = String(i + 1).padStart(3, '0');
            const fileName = `${id}_${dateStr}_item${indexStr}.wav`;
            
            zip.file(fileName, r.wav);
            tsv += `${id}\t${dateStr}\t${fileName}\t${r.s}\t${r.t}\n`;
        });
        
        zip.file(`Metadata_${id}_${dateStr}.tsv`, tsv);
        const blob = await zip.generateAsync({type:"blob"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        // 修改点：改为 _Data.zip
        a.download = `${id}_${dateStr}_Data.zip`;
        a.click();
        
        window.open(ONEDRIVE_LINK, '_blank');
        setTimeout(() => location.reload(), 3000);
    }

    function exportWAV(bufferList) {
        let len = bufferList.reduce((a, b) => a + b.length, 0);
        let result = new Float32Array(len);
        let offset = 0;
        for (let b of bufferList) { result.set(b, offset); offset += b.length; }
        const wav = new ArrayBuffer(44 + result.length * 2);
        const view = new DataView(wav);
        const s = (o, v) => { for (let i = 0; i < v.length; i++) view.setUint8(o + i, v.charCodeAt(i)); };
        s(0, 'RIFF'); view.setUint32(4, 32 + result.length * 2, true);
        s(8, 'WAVE'); s(12, 'fmt '); view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        s(36, 'data'); view.setUint32(40, result.length * 2, true);
        offset = 44;
        for (let i = 0; i < result.length; i++, offset += 2) {
            let val = Math.max(-1, Math.min(1, result[i]));
            view.setInt16(offset, val < 0 ? val * 0x8000 : val * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }
</script>
</body>
</html>
